name: Build release apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS
            os: macos-latest
            args: --bundles dmg --target universal-apple-darwin

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check release tag matches app version
        if: github.event_name == 'release'
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${{ github.event.release.tag_name }}"
          tag_version=$(echo "$tag" | sed -E 's/^[vV]\.?//')
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Le tag $tag ne correspond pas à la version de l'app ($app_version). Mettez à jour package.json, Cargo.toml et tauri.conf.json avant de publier."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run icons
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: npm run check
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: v__VERSION__
          releaseName: Clave v__VERSION__
          releaseBody: Consultez les notes de version pour connaitre les changements.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  verify-updater:
    name: Verify updater manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check latest.json is published
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            url="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/latest.json"
          else
            url="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          fi
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "$url" -o latest.json; then
              break
            fi
            [ "$attempt" = 5 ] && exit 1
            sleep 10
          done
          cat latest.json
          grep -q '"version"' latest.json
