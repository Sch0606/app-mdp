name: Build release apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            build-command: npm run tauri -- build --bundles nsis
            assets: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            bundles: dmg
            build-command: npm run tauri -- build --bundles dmg --target universal-apple-darwin
            assets: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npm run icons

      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Run Rust tests
        run: npm run check

      - name: Build Tauri bundle
        run: ${{ matrix.build-command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clave-${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.assets }}
