name: Build macOS biometry test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos-biometry:
    name: Build signed macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npm run icons

      - name: Run tests
        run: npm run check

      - name: Build ad-hoc signed macOS app
        run: npm run build:mac-local

      - name: Build ad-hoc signed macOS DMG
        run: npm run build:mac-dmg

      - name: Verify app signature and entitlements
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Clave.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Zip app
        run: |
          mkdir -p dist
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          ditto -c -k --keepParent "$APP_DIR/Clave.app" "dist/Clave-macOS-biometry-test.zip"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/

      - name: Upload macOS app
        uses: actions/upload-artifact@v6
        with:
          name: Clave-macOS-biometry-test
          path: dist/*
          if-no-files-found: error
