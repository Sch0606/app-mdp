<!doctype html>
<!--
  Déchiffreur hors ligne des liens de partage Clave.

  Ce fichier ne dépend pas du serveur de partage : conservez-en une copie locale
  (ou hébergez-la ailleurs que sur le serveur de stockage) et vérifiez son
  empreinte SHA-256 publiée dans share-server/README.md. Un serveur de partage
  compromis ne peut donc pas en modifier le code pour voler la clé : seul le
  texte chiffré est demandé au serveur, la clé ne quitte jamais cette page.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
  <title>Déchiffreur Clave</title>
  <style>
    body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f6;color:#17211c}
    main{max-width:560px;margin:0 auto;padding:32px 16px}
    label{display:block;font-weight:600;margin-bottom:6px}
    input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d1cc;border-radius:8px;font:inherit}
    button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#1f6f4a;color:#fff;font:inherit;cursor:pointer}
    dl{display:grid;gap:4px 0}dt{font-weight:600;margin-top:10px}dd{margin:0}
    code,pre{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid #e1e6e3;border-radius:6px;padding:6px 8px;display:block}
    .error{color:#a3271f}
    @media (prefers-color-scheme:dark){body{background:#111614;color:#e6ece8}input,code,pre{background:#1a211e;color:inherit;border-color:#2c3732}}
  </style>
</head>
<body>
  <main>
    <h1>Déchiffreur Clave hors ligne</h1>
    <p>Collez le lien complet reçu (avec la partie après le <code style="display:inline">#</code>). Le contenu chiffré est récupéré une seule fois puis détruit sur le serveur ; le déchiffrement a lieu dans cette page.</p>
    <form id="form">
      <label for="link">Lien de partage</label>
      <input id="link" type="url" autocomplete="off" spellcheck="false" required>
      <button type="submit">Déchiffrer</button>
    </form>
    <p id="status" role="status"></p>
    <dl id="fields"></dl>
  </main>
  <script>
    'use strict'
    const NONCE_LENGTH = 12
    const KEY_LENGTH = 32
    const FIELDS = [['title', 'Titre'], ['username', 'Identifiant'], ['password', 'Mot de passe'], ['url', 'Site'], ['notes', 'Notes']]

    function base64UrlToBytes(value) {
      if (!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error('Encodage invalide.')
      const base64 = value.replace(/-/g, '+').replace(/_/g, '/')
      const binary = atob(base64 + '='.repeat((4 - (base64.length % 4)) % 4))
      return Uint8Array.from(binary, (char) => char.charCodeAt(0))
    }

    function parseLink(text) {
      const url = new URL(text.trim())
      const local = ['localhost', '127.0.0.1'].includes(url.hostname)
      if (url.protocol !== 'https:' && !(url.protocol === 'http:' && local)) throw new Error('Le lien doit être en HTTPS.')
      const match = url.pathname.match(/^(.*)\/s\/([A-Za-z0-9_-]{22})$/)
      const key = url.hash.slice(1)
      if (!match || !key) throw new Error('Lien incomplet : identifiant ou clé absent.')
      return { reveal: `${url.origin}${match[1]}/api/secrets/${match[2]}/reveal`, key }
    }

    async function decrypt(ciphertext, keyText) {
      const keyBytes = base64UrlToBytes(keyText)
      if (keyBytes.length !== KEY_LENGTH) throw new Error('Clé invalide.')
      const data = base64UrlToBytes(ciphertext)
      if (data.length <= NONCE_LENGTH) throw new Error('Contenu invalide.')
      const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt'])
      const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, NONCE_LENGTH) }, key, data.slice(NONCE_LENGTH))
      const payload = JSON.parse(new TextDecoder().decode(plaintext))
      if (payload?.v !== 1) throw new Error('Version non prise en charge.')
      return payload
    }

    function render(payload) {
      const list = document.getElementById('fields')
      list.replaceChildren()
      for (const [name, label] of FIELDS) {
        if (!payload[name]) continue
        const term = document.createElement('dt')
        term.textContent = label
        const detail = document.createElement('dd')
        const value = document.createElement(name === 'notes' ? 'pre' : 'code')
        value.textContent = String(payload[name])
        detail.append(value)
        list.append(term, detail)
      }
    }

    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      const status = document.getElementById('status')
      const input = document.getElementById('link')
      status.className = ''
      status.textContent = 'Déchiffrement…'
      try {
        const { reveal, key } = parseLink(input.value)
        input.value = ''
        const response = await fetch(reveal, { method: 'POST', credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store' })
        const body = await response.json().catch(() => ({}))
        if (!response.ok || typeof body.ciphertext !== 'string') throw new Error(body.error || 'Ce lien a déjà été consulté ou a expiré.')
        render(await decrypt(body.ciphertext, key))
        status.textContent = 'Ce lien est désormais inutilisable.'
      } catch (error) {
        status.className = 'error'
        status.textContent = error?.message || 'Échec du déchiffrement.'
      }
    })
  </script>
</body>
</html>
