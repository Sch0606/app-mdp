[package]
name = "clave"
version = "0.1.0"
description = "Coffre local de mots de passe"
authors = ["Clave"]
edition = "2021"

[lib]
name = "clave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-biometry = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
